server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: appointment-service-rest
          uri: http://localhost:8081
          predicates:
            - Path=/api/appointments/bookings/**

        - id: appointment-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/appointments/**
          filters:
            - RewritePath=/api/appointments(?<segment>/?.*), /ws$\{segment}
            - RemoveRequestHeader=X-Forwarded-Prefix

        - id: medical-record-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/medical-records/**, /api/diagnoses/**, /api/allergies/**, /api/medications/**, /api/prescribed-medications/**, /api/procedures/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        - id: user-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway