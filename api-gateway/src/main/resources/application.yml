server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: appointment-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/appointments/**

        - id: user-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway