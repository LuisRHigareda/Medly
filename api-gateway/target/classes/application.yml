server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service-auth
          uri: http://localhost:8091
          predicates:
            - Path=/api/auth/**

        - id: user-service-users
          uri: http://localhost:8091
          predicates:
            - Path=/api/users/**

        - id: appointment-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/appointments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway