<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Medly</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
    <div class="card">
        <h1>Menu</h1>
        <h2>Available Options</h2>
        <ul>
            <li>
                <button onclick="location.href='/schedule'">Schedule Appointment</button>
            </li>
            <li>
                <button onclick="location.href='/cancel'">Cancel Appointment</button>
            </li>
            <li>
                <button onclick="location.href='/upcoming'">View Upcoming</button>
            </li>
            <li>
                <form action="/home/logout" method="post">
                    <button type="submit" class="btn-secondary">Logout</button>
                </form>
            </li>
        </ul>
    </div>
</body>
</html>
